services:
  av-jobs-bot:
    build:
      # Contexto na raiz para a imagem alcançar `db/schema.sql`, que o bot
      # aplica no boot e o painel consome.
      context: .
      dockerfile: bot/Dockerfile
    container_name: av-jobs-bot
    restart: unless-stopped
    # NÃO usar `env_file: .env` — o .env está no .gitignore, então ele não existe
    # no repositório que o Coolify clona e o compose quebra antes de subir.
    # Com substituição de variáveis funciona nos dois casos: local o compose lê
    # o .env da pasta automaticamente, e em produção o Coolify injeta as vars.
    environment:
      - ONM_EMAIL=${ONM_EMAIL}
      - ONM_PASSWORD=${ONM_PASSWORD}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-600}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Vazio = usa bot/config/ dentro da imagem. Só preencher para apontar
      # para um arquivo montado por fora.
      - PROFILE_FILE=${PROFILE_FILE:-}
      - TERMS_FILE=${TERMS_FILE:-}
      - LINKEDIN_TERMS_FILE=${LINKEDIN_TERMS_FILE:-}
      - SOURCES=${SOURCES:-onm,gupy,indeed,linkedin}
      # Ritmo de cada fonte. Gupy e Indeed fazem 1 requisição por termo de
      # busca; o LinkedIn faz 2 por vaga (busca + descrição), por isso é o mais
      # espaçado.
      - INTERVAL_ONM=${INTERVAL_ONM:-600}
      - INTERVAL_GUPY=${INTERVAL_GUPY:-3600}
      - INTERVAL_INDEED=${INTERVAL_INDEED:-3600}
      - INTERVAL_LINKEDIN=${INTERVAL_LINKEDIN:-7200}
      - TIMEZONE=${TIMEZONE:-America/Sao_Paulo}
      - REPORT_HOUR=${REPORT_HOUR:-22}
      - REPORT_TO=${REPORT_TO:-grupo}
      - REPORT_CHAT_IDS=${REPORT_CHAT_IDS:-}
      # Controle de volume e horário de publicação (pedido do Gabriel, 12/08).
      # O painel sobrescreve estes valores em runtime, sem redeploy.
      - DAILY_LIMIT=${DAILY_LIMIT:-8}
      - SEND_WINDOW_START=${SEND_WINDOW_START:-6}
      - SEND_WINDOW_END=${SEND_WINDOW_END:-23}
      - QUEUE_TTL_DAYS=${QUEUE_TTL_DAYS:-3}
      - MIN_SCORE=${MIN_SCORE:-0}
      # Regras de corte.
      - REJECT_ENGLISH=${REJECT_ENGLISH:-true}
      - REJECT_SENIOR=${REJECT_SENIOR:-true}
      - REQUIRE_EXPLICIT_REMOTE=${REQUIRE_EXPLICIT_REMOTE:-true}
      # Apresentação do bot no privado (não há mais comando administrativo).
      - SITE_URL=${SITE_URL:-https://gabrielvitolla.com.br}
      - INSTAGRAM_URL=${INSTAGRAM_URL:-https://instagram.com/gabriel.assistentevirtual}
      - SUPORTE_TELEGRAM=${SUPORTE_TELEGRAM:-}
      # Banco do painel. Vazio = bot roda igual, só sem alimentar o dashboard.
      - DATABASE_URL=${DATABASE_URL:-}
      # DATA_DIR fica fixo no volume — não sobrescrever pelo painel.
      - DATA_DIR=/app/data
    volumes:
      # Sobrevivem a redeploy: seen_ids.json, skipped_jobs.jsonl, quota_log.jsonl
      # e — novos em 12/08 — daily_stats.json (contadores do dia, que antes
      # zeravam a cada push) e send_queue.json (a fila de vagas esperando).
      - bot-data:/app/data
      # profile.md vai pela imagem (COPY no Dockerfile). Pra ajustar o filtro em
      # produção: edita, commita, pusha → Coolify rebuilda. Local, rode
      # `python main.py` direto — o cache por mtime pega a edição na hora.

  av-jobs-admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: av-jobs-admin
    restart: unless-stopped
    environment:
      # Mesmo Postgres do bot: um escreve os eventos, o outro os lê.
      - DATABASE_URL=${DATABASE_URL}
      # Assina o cookie de sessão. Sem isto o painel se recusa a subir — é o
      # que impede alguém de forjar uma sessão de administrador.
      - AUTH_SECRET=${AUTH_SECRET}
      - NODE_ENV=production
    depends_on:
      - av-jobs-bot
    # O Coolify põe o Traefik na frente e cuida do domínio e do certificado;
    # a porta não precisa ser publicada no host.
    expose:
      - "3000"

volumes:
  bot-data:
